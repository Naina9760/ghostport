<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GhostPort architecture</title>
  <desc id="desc">Network packets flow through a Linux interface to a TCX eBPF sensor, a bounded kernel map, the Go controller, and text or JSON telemetry.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18bfe5"/>
      <stop offset="1" stop-color="#6d5ce8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#278bdc"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17335f" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#ffffff"/>
  <path d="M0 72H1200M0 144H1200M0 216H1200M0 288H1200M0 360H1200M100 0V420M200 0V420M300 0V420M400 0V420M500 0V420M600 0V420M700 0V420M800 0V420M900 0V420M1000 0V420M1100 0V420" stroke="#e9f0fb" stroke-width="1"/>
  <text x="54" y="58" fill="#102a56" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700">GhostPort data path</text>
  <text x="54" y="88" fill="#5f7395" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Payload-free flow telemetry at the Linux kernel boundary</text>

  <g filter="url(#shadow)" font-family="ui-sans-serif,system-ui,sans-serif">
    <g transform="translate(54 145)">
      <rect width="190" height="150" rx="18" fill="url(#panel)" stroke="#cbdaf0"/>
      <circle cx="52" cy="58" r="22" fill="#d9f6fc" stroke="#18bfe5" stroke-width="2"/>
      <path d="M38 58h28M52 44v28" stroke="#1689c5" stroke-width="3" stroke-linecap="round"/>
      <text x="95" y="54" fill="#102a56" font-size="18" font-weight="700">Linux</text>
      <text x="95" y="78" fill="#5f7395" font-size="14">interface</text>
      <text x="24" y="122" fill="#5f7395" font-size="13">IPv4 ingress packets</text>
    </g>
    <g transform="translate(300 145)">
      <rect width="190" height="150" rx="18" fill="url(#panel)" stroke="#9fdff0"/>
      <path d="M64 38c-24 0-37 19-37 40v30c0 5 6 8 10 4l8-8 9 8 9-8 9 8 9-8 9 8c4 4 10 1 10-4V78c0-21-13-40-36-40z" fill="#ffffff" stroke="#2aaee8" stroke-width="3"/>
      <circle cx="52" cy="72" r="5" fill="#173b74"/><circle cx="77" cy="72" r="5" fill="#173b74"/>
      <text x="112" y="62" fill="#102a56" font-size="18" font-weight="700">TCX</text>
      <text x="112" y="86" fill="#5f7395" font-size="14">eBPF sensor</text>
      <text x="28" y="128" fill="#5f7395" font-size="13">Verifier-safe parsing</text>
    </g>
    <g transform="translate(546 145)">
      <rect width="190" height="150" rx="18" fill="url(#panel)" stroke="#c9c4f7"/>
      <ellipse cx="56" cy="56" rx="30" ry="12" fill="#e8e5ff" stroke="#7364e9" stroke-width="2"/>
      <path d="M26 56v48c0 7 13 12 30 12s30-5 30-12V56" fill="#f7f6ff" stroke="#7364e9" stroke-width="2"/>
      <path d="M26 80c0 7 13 12 30 12s30-5 30-12" fill="none" stroke="#7364e9" stroke-width="2"/>
      <text x="105" y="62" fill="#102a56" font-size="18" font-weight="700">Kernel map</text>
      <text x="105" y="86" fill="#5f7395" font-size="14">bounded counters</text>
      <text x="28" y="132" fill="#5f7395" font-size="13">No packet payloads</text>
    </g>
    <g transform="translate(792 145)">
      <rect width="190" height="150" rx="18" fill="url(#panel)" stroke="#bdd5ee"/>
      <rect x="28" y="38" width="58" height="70" rx="10" fill="#ffffff" stroke="#278bdc" stroke-width="2"/>
      <path d="M41 58h32M41 72h24M41 86h29" stroke="#278bdc" stroke-width="3" stroke-linecap="round"/>
      <text x="105" y="62" fill="#102a56" font-size="18" font-weight="700">Go</text>
      <text x="105" y="86" fill="#5f7395" font-size="14">controller</text>
      <text x="28" y="132" fill="#5f7395" font-size="13">Lifecycle and reporting</text>
    </g>
    <g transform="translate(1038 145)">
      <rect width="110" height="150" rx="18" fill="url(#panel)" stroke="#cbdaf0"/>
      <path d="M28 48h54M28 66h42M28 84h50" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
      <text x="55" y="116" text-anchor="middle" fill="#102a56" font-size="16" font-weight="700">Text</text>
      <text x="55" y="137" text-anchor="middle" fill="#5f7395" font-size="13">or JSON</text>
    </g>
  </g>
  <g stroke="#278bdc" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M250 220H290"/><path d="M496 220H536"/><path d="M742 220H782"/><path d="M988 220H1028"/>
  </g>
  <g fill="#1689c5">
    <circle cx="263" cy="220" r="4"/><circle cx="509" cy="220" r="4"/><circle cx="755" cy="220" r="4"/><circle cx="1001" cy="220" r="4"/>
  </g>
  <text x="600" y="365" text-anchor="middle" fill="#5f7395" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14">Observe only • bounded state • clean detach • reproducible builds</text>
</svg>
